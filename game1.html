<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>救救東勢金城武 - 課表選關版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Matter.js 2D Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

    * {
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
    }

    /* Blackboard theme */
    .chalkboard-bg {
      background: #1e3f2c;
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.5) 100%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 10px);
    }

    .chalkboard-frame {
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8), 0 15px 35px -5px rgba(0, 0, 0, 0.6);
      border: 12px solid #78350f;
      border-image: linear-gradient(135deg, #a16207, #451a03 40%, #78350f 70%, #92400e) 12;
    }

    /* Ruled Memo Paper Card */
    .memo-paper {
      background: #fafaf9;
      background-image: repeating-linear-gradient(transparent, transparent 19px, #e2e8f0 20px);
      box-shadow: 2px 4px 8px rgba(0,0,0,0.35);
    }
    .memo-paper-locked {
      background: #64748b;
      background-image: repeating-linear-gradient(transparent, transparent 19px, rgba(255,255,255,0.1) 20px);
      opacity: 0.72;
    }

    /* Traditional Red Seal Stamp "優" */
    .stamp-excellent {
      width: 22px;
      height: 22px;
      border: 1.5px solid #dc2626;
      border-radius: 50%;
      color: #dc2626;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 11px;
      line-height: 1;
      transform: rotate(-5deg);
    }
    .stamp-empty {
      width: 22px;
      height: 22px;
      border: 1.5px dashed #94a3b8;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Custom scrollbar for schedule */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.25);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-stone-950 min-h-screen flex flex-col items-center justify-center p-1 sm:p-4 overflow-hidden select-none">

  <!-- Main Blackboard Container -->
  <div class="relative w-full max-w-[480px] h-[96vh] max-h-[880px] flex flex-col rounded-2xl chalkboard-bg chalkboard-frame shadow-2xl overflow-hidden">
    
    <!-- ================= TOP HUD (GAME SCREEN) ================= -->
    <header id="game-header" class="w-full bg-black/60 backdrop-blur-md px-3 py-2 border-b border-white/20 flex flex-col gap-1.5 z-10 text-white">
      <div class="flex items-center justify-between">
        <!-- Level & Schedule Nav -->
        <div class="flex items-center gap-1.5">
          <button id="btn-open-schedule" class="bg-amber-100 hover:bg-white text-stone-900 font-black px-2.5 py-1 rounded text-xs shadow flex items-center gap-1 active:scale-95 transition">
            <i class="fa-solid fa-calendar-days text-amber-700"></i> 課表
          </button>
          <span class="text-xs text-amber-200 font-extrabold truncate max-w-[130px]" id="level-title-display">
            第 1 關：第一堂課
          </span>
        </div>

        <!-- Defend Countdown Timer -->
        <div id="timer-box" class="flex items-center gap-1 font-mono text-sm font-black text-amber-300 bg-black/70 px-2 py-0.5 rounded border border-amber-500/40">
          <i class="fa-solid fa-stopwatch text-amber-400"></i>
          <span id="timer-text">10.0s</span>
        </div>

        <!-- Utility Buttons -->
        <div class="flex items-center gap-1">
          <button id="btn-custom-faces" title="更換頭像" class="p-1.5 bg-sky-700/80 hover:bg-sky-600 text-white text-xs font-bold rounded shadow active:scale-95 transition">
            <i class="fa-solid fa-camera"></i>
          </button>
          <button id="btn-restart" class="p-1.5 px-2 bg-rose-700/90 hover:bg-rose-600 text-white text-xs font-bold rounded shadow active:scale-95 transition flex items-center gap-1">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
        </div>
      </div>

      <!-- Ink (Chalk) Gauge with 3-Star Grading Markers -->
      <div class="flex flex-col gap-0.5">
        <div class="flex justify-between items-center text-[10px] text-white/90 font-bold px-1">
          <span><i class="fa-solid fa-pen mr-1"></i>粉筆用量</span>
          <div class="flex items-center gap-1.5" id="hud-stamps">
            <span class="stamp-excellent">優</span>
            <span class="stamp-excellent">優</span>
            <span class="stamp-excellent">優</span>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="relative w-full h-3 bg-black/75 rounded-full overflow-hidden border border-white/30 p-0.5">
          <div id="ink-fill" class="h-full bg-gradient-to-r from-emerald-400 via-amber-300 to-rose-400 rounded-full transition-all duration-75 w-full"></div>
          <!-- 3-Star Threshold Markers -->
          <div class="absolute top-0 bottom-0 left-[35%] w-0.5 bg-white/50 pointer-events-none"></div>
          <div class="absolute top-0 bottom-0 left-[70%] w-0.5 bg-white/50 pointer-events-none"></div>
        </div>
      </div>
    </header>

    <!-- ================= CANVAS PLAY AREA ================= -->
    <div class="relative flex-1 w-full h-full overflow-hidden bg-transparent">
      <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>

      <!-- Draw Instruction Overlay -->
      <div id="guide-overlay" class="absolute top-3 left-0 right-0 pointer-events-none flex justify-center items-center transition-opacity duration-300">
        <span class="bg-black/75 text-amber-200 px-3 py-1 rounded-full text-xs font-bold border border-amber-400/40 shadow-xl flex items-center gap-1 animate-bounce">
          ✍️ 一筆畫出防護線！放開後蜜蜂出動！
        </span>
      </div>
    </div>

    <!-- Classroom Chalk Tray Footer -->
    <footer class="h-5 bg-[#3a1d0b] border-t-2 border-[#1e0e05] flex items-center justify-around px-4 shadow-inner z-10">
      <div class="w-10 h-1.5 bg-white rounded-sm opacity-90 -rotate-2"></div>
      <div class="w-8 h-1.5 bg-yellow-200 rounded-sm opacity-90 rotate-1"></div>
      <div class="w-12 h-1.5 bg-sky-200 rounded-sm opacity-90"></div>
      <div class="w-14 h-2 bg-neutral-800 rounded-sm border border-neutral-700 flex items-center justify-center text-[8px] text-neutral-400 font-bold">板擦</div>
    </footer>

    <!-- ================= SCHEDULE / LEVEL SELECT MODAL (課表) ================= -->
    <div id="schedule-screen" class="absolute inset-0 bg-[#1e3f2c] z-30 flex flex-col p-3 transition-transform duration-300 transform translate-y-full">
      
      <!-- Schedule Header -->
      <div class="flex items-center justify-between pb-2 border-b border-white/20">
        <div class="flex items-center gap-2">
          <button id="btn-schedule-back" class="bg-amber-100 hover:bg-white text-stone-900 font-bold px-2.5 py-1 rounded text-xs shadow active:scale-95 transition">
            返回
          </button>
          <h2 class="text-2xl font-black text-amber-100 tracking-wider">課 表</h2>
        </div>
        <!-- Total Stars Count -->
        <div class="flex items-center gap-1 bg-black/40 px-3 py-1 rounded-lg border border-amber-400/30">
          <span class="stamp-excellent scale-90">優</span>
          <span id="total-stars-count" class="text-amber-200 font-black text-sm">0 / 45</span>
        </div>
      </div>

      <!-- Semester Switcher Tabs -->
      <div class="flex gap-2 my-2.5">
        <button id="tab-sem1" class="flex-1 py-1.5 rounded-lg font-black text-xs transition border-2 border-white/40 bg-amber-100 text-stone-900 shadow">
          上學期
        </button>
        <button id="tab-sem2" class="flex-1 py-1.5 rounded-lg font-black text-xs transition border-2 border-dashed border-white/30 bg-black/30 text-amber-100/70 hover:bg-black/50">
          下學期・大力蜂
        </button>
      </div>

      <!-- Level Cards Grid (Scrollable) -->
      <div class="flex-1 overflow-y-auto custom-scroll pr-1">
        <div id="level-grid" class="grid grid-cols-3 gap-2.5 pb-2">
          <!-- Dynamically populated memo cards -->
        </div>
      </div>

      <!-- Footer Help Chalk Text -->
      <div class="pt-2 border-t border-white/20 text-center">
        <p class="text-[11px] text-white/80 leading-relaxed font-medium">
          畫一條粉筆線護住金城武，撐過倒數就下課。粉筆用得越少，老師蓋的「優」越多。
        </p>
      </div>
    </div>

    <!-- ================= RESULT MODAL (聯絡簿結算) ================= -->
    <div id="result-modal" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
      <div class="w-full max-w-xs bg-amber-50 rounded-2xl p-5 shadow-2xl border-4 border-amber-800 flex flex-col items-center text-center transform scale-95 transition-all duration-200" id="modal-card">
        
        <div id="modal-icon-badge" class="w-16 h-16 rounded-full flex items-center justify-center text-3xl shadow-lg -mt-10 mb-2 border-2 border-white">
          🎉
        </div>

        <p id="modal-desc" class="text-xs text-amber-800/90 mb-3 font-medium">金城武安全撐過 10 秒！</p>

          <span class="stamp-excellent scale-125">優</span>
          <span class="stamp-excellent scale-125">優</span>
        </div>

        <!-- Controls -->
        <div class="flex gap-2 w-full">
          <button id="modal-btn-schedule" class="py-2 px-2.5 bg-stone-700 hover:bg-stone-600 text-white font-bold rounded-xl text-xs active:scale-95 transition shadow">
            <i class="fa-solid fa-list-check"></i>
          </button>
          <button id="modal-btn-retry" class="flex-1 py-2.5 px-3 bg-neutral-200 hover:bg-neutral-300 text-neutral-800 font-bold rounded-xl text-xs active:scale-95 transition shadow">
            <i class="fa-solid fa-redo mr-1"></i> 重來
          </button>
          <button id="modal-btn-next" class="flex-1 py-2.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs active:scale-95 transition shadow">
            下一關 <i class="fa-solid fa-arrow-right ml-1"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- ================= CUSTOM AVATAR MODAL ================= -->
    <div id="face-modal" class="absolute inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
      <div class="w-full max-w-sm bg-stone-900 border-2 border-amber-500/60 rounded-2xl p-4 text-white flex flex-col gap-3 shadow-2xl">
        <div class="flex justify-between items-center border-b border-white/20 pb-2">
          <h4 class="font-black text-sm text-amber-300 flex items-center gap-1.5">
            <i class="fa-solid fa-images"></i> 設定角色表情 (001, 002, 003)
          </h4>
          <button id="btn-close-face-modal" class="text-neutral-400 hover:text-white text-base">
            <i class="fa-solid fa-xmark"></i>
          </button>

        <div class="grid grid-cols-3 gap-2 text-center text-[10px]">
          <div class="flex flex-col items-center gap-1 bg-neutral-800 p-2 rounded-xl border border-neutral-700">
            <span class="font-bold text-amber-200">1. 微笑 (001)</span>
            <img id="preview-normal" class="w-14 h-20 object-contain rounded bg-black/40 border border-neutral-600" alt="平時">
            <label class="cursor-pointer bg-amber-600 hover:bg-amber-500 text-white px-2 py-0.5 rounded text-[9px] mt-1 font-bold">
              換圖 <input type="file" id="file-normal" accept="image/*" class="hidden">

          </div>
          <div class="flex flex-col items-center gap-1 bg-neutral-800 p-2 rounded-xl border border-neutral-700">
            <span class="font-bold text-amber-200">2. 驚恐 (002)</span>
            <img id="preview-scared" class="w-14 h-20 object-contain rounded bg-black/40 border border-neutral-600" alt="驚恐">
            <label class="cursor-pointer bg-amber-600 hover:bg-amber-500 text-white px-2 py-0.5 rounded text-[9px] mt-1 font-bold">
              換圖 <input type="file" id="file-scared" accept="image/*" class="hidden">
            </label>
          </div>
          <div class="flex flex-col items-center gap-1 bg-neutral-800 p-2 rounded-xl border border-neutral-700">

              換圖 <input type="file" id="file-hurt" accept="image/*" class="hidden">

          </div>
        </div>

        <button id="btn-save-face-modal" class="w-full py-2 bg-amber-500 hover:bg-amber-400 text-amber-950 font-black rounded-xl text-xs transition mt-1 shadow-lg">
          確定完成
        </button>
      </div>
    </div>

  </div>

  <script>
    // --- MATTER.JS MODULES ---
    const { Engine, World, Bodies, Body, Events } = Matter;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let engine = null;
    let world = null;

    // Game lifecycle: 'DRAWING' -> 'DEFENDING' -> 'GAME_OVER'
    let gameState = 'DRAWING';
    let currentSemester = 1; // 1: 上學期, 2: 下學期
    let currentLevelId = 1;

    // Ink Configuration
    const MAX_INK_LENGTH = 1400;
    let currentInkRemaining = MAX_INK_LENGTH;
    let isDrawing = false;
    let rawStrokePoints = [];

    // Defend duration
    const DEFEND_DURATION = 10.0;
    let remainingTime = DEFEND_DURATION;
    let timerInterval = null;

    // Entities
    let characterBody = null;
    let characterMood = 'normal'; // 'normal', 'scared', 'hurt', 'victory'
    const CHAR_RADIUS = 30;

    let beeHives = [];
    let bees = [];
    let staticPlatforms = [];
    let dangerSpikes = [];
    let userDrawnBodies = [];
    let particles = [];
    let impactTexts = [];

    // --- LEVEL PROGRESSION (LOCALSTORAGE) ---
    function loadProgress() {
      try {
        const raw = localStorage.getItem('save_student_progress');
        const data = raw ? JSON.parse(raw) : {};
        if (data["1"] === undefined) data["1"] = 0;   // 上學期第 1 關預設可玩
        if (data["16"] === undefined) data["16"] = 0; // 下學期大力蜂第 16 關預設可玩
        return data;
      } catch (e) {
        return { "1": 0, "16": 0 };
      }
    }

    function saveLevelScore(levelId, stars) {
      const progress = loadProgress();
      const currentBest = progress[levelId] || 0;
      if (stars > currentBest) {
        progress[levelId] = stars;
      }
      const nextId = levelId + 1;
      if (progress[nextId] === undefined && nextId <= 30) {
        progress[nextId] = 0;
      }
      try {
        localStorage.setItem('save_student_progress', JSON.stringify(progress));
      } catch (e) {}
    }

    // --- AUDIO SYSTEM (Web Audio API Synthesizer) ---
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx && AudioContextClass) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.15, vol = 0.12) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playChalkSound() {
      if (Math.random() < 0.25) playTone(500 + Math.random() * 250, 'triangle', 0.04, 0.02);
    }

    function playStingSound() {
      playTone(130, 'sawtooth', 0.45, 0.25);
    }

    function playHeavyImpactSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {}
    }

    // --- CONVERT DRAWN STROKE TO COMPOUND RIGID BODY ---
    function convertPointsToRigidBody(points) {
      if (points.length < 2) return;

      const simplified = [points[0]];
      for (let i = 1; i < points.length; i++) {
        const last = simplified[simplified.length - 1];
        if (Math.hypot(points[i].x - last.x, points[i].y - last.y) > 7) {
          simplified.push(points[i]);
        }
      }
      if (simplified.length < 2) return;

      const segments = [];
      const CHALK_THICKNESS = 14;

      for (let i = 0; i < simplified.length - 1; i++) {
        const p1 = simplified[i];
        const p2 = simplified[i + 1];
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);

        const segment = Bodies.rectangle(midX, midY, len + 2, CHALK_THICKNESS, {
          angle: ang,
          label: 'ChalkBarrier',
          friction: 0.9,
          restitution: 0.05,
          density: 0.0028,
          chamfer: { radius: CHALK_THICKNESS / 2 }
        });
        segments.push(segment);
      }

      const chalkCompound = Body.create({
        parts: segments,
        label: 'ChalkBarrier',
        friction: 0.9,
        restitution: 0.05,
        density: 0.0028
      });

      World.add(world, chalkCompound);
      userDrawnBodies.push(chalkCompound);
    }

    // --- BEE SPAWN & SMOOTH HOVERING AIR-FLIGHT PHYSICS ---
    function spawnBee(hive, isLeader = false) {
      const angle = Math.random() * Math.PI * 2;
      const bx = hive.x + Math.cos(angle) * 14;
      const by = hive.y + Math.sin(angle) * 14;

      // 只有蜂王是大隻的 (半徑 18px，質量倍增)；其餘皆為標準大小 (半徑 8px)
      const beeRadius = isLeader ? 18 : 8;
      const beeBody = Bodies.circle(bx, by, beeRadius, {
        label: 'Bee',
        frictionAir: isLeader ? 0.09 : 0.12,
        friction: 0.1,
        restitution: isLeader ? 0.35 : 0.45,
        density: isLeader ? 0.006 : 0.0012
      });

      World.add(world, beeBody);
      bees.push({
        body: beeBody,
        heavy: isLeader,
        buzzSeed: Math.random() * 1000,
        wingPhase: Math.random() * 10,
        floatFreq: 1.8 + Math.random() * 1.2,
        floatAmp: (isLeader ? 0.0005 : 0.00035) + Math.random() * 0.0002
      });

      createSparks(hive.x, hive.y, '#f59e0b', 3);
    }

    function updateBeeFlightPhysics() {
      if (gameState !== 'DEFENDING' || !characterBody) return;

      const targetPos = characterBody.position;
      const now = Date.now() * 0.001;

      bees.forEach((bee, i) => {
        const pos = bee.body.position;
        const dx = targetPos.x - pos.x;
        const dy = targetPos.y - pos.y;
        const dist = Math.hypot(dx, dy) || 1;

        // Counteract world gravity to ensure hovering in the air
        const antiGravity = -world.gravity.y * world.gravity.scale * bee.body.mass;

        // Controlled pursuit thrust
        const gentleSpeed = bee.heavy ? 0.0018 : 0.00065;
        let fx = (dx / dist) * gentleSpeed;
        let fy = (dy / dist) * gentleSpeed + antiGravity;

        // Smooth floating & hover bobbing (sine wave)
        const hoverWave = Math.sin(now * bee.floatFreq * Math.PI * 2 + bee.buzzSeed);
        fy += hoverWave * bee.floatAmp;
        fx += Math.cos(now * 1.5 + bee.buzzSeed) * 0.00025;

        // Swarm Separation
        for (let j = 0; j < bees.length; j++) {
          if (i === j) continue;
          const otherPos = bees[j].body.position;
          const sepX = pos.x - otherPos.x;
          const sepY = pos.y - otherPos.y;
          const sepDist = Math.hypot(sepX, sepY);
          if (sepDist < 26 && sepDist > 0) {
            fx += (sepX / sepDist) * 0.0003;
            fy += (sepY / sepDist) * 0.0003;
          }
        }

        Body.applyForce(bee.body, pos, { x: fx, y: fy });

        // Clamp speed
        const MAX_BEE_SPEED = bee.heavy ? 3.6 : 2.5;
        const currentSpeed = Math.hypot(bee.body.velocity.x, bee.body.velocity.y);
        if (currentSpeed > MAX_BEE_SPEED) {
          Body.setVelocity(bee.body, {
            x: (bee.body.velocity.x / currentSpeed) * MAX_BEE_SPEED,
            y: (bee.body.velocity.y / currentSpeed) * MAX_BEE_SPEED
          });
        }

        bee.wingPhase += 0.8;
      });
    }

    // --- FINISH DRAWING & START DEFENDING ---
    function finishDrawingAndStartDefend() {
      if (rawStrokePoints.length < 2) {
        rawStrokePoints = [];
        return;
      }

      convertPointsToRigidBody(rawStrokePoints);
      rawStrokePoints = [];

      gameState = 'DEFENDING';
      characterMood = 'scared';
      document.getElementById('guide-overlay').style.opacity = '0';

      beeHives.forEach(hive => {
        for (let i = 0; i < hive.count; i++) {
          setTimeout(() => {
            if (gameState === 'DEFENDING') {
              // 下學期關卡中，僅第一隻蜂 (i === 0) 為巨型大力蜂首領，其餘皆為普通大小
              const isLeader = hive.heavy && (i === 0);
              spawnBee(hive, isLeader);
            }
          }, i * 200);
        }
      });

      remainingTime = DEFEND_DURATION;
      document.getElementById('timer-text').innerText = remainingTime.toFixed(1) + 's';

      timerInterval = setInterval(() => {
        remainingTime -= 0.1;
        if (remainingTime <= 0) {
          remainingTime = 0;
          clearInterval(timerInterval);
          triggerVictory();
        }
        document.getElementById('timer-text').innerText = Math.max(0, remainingTime).toFixed(1) + 's';
      }, 100);
    }

    // --- IMPACT POPUP TEXT ---
    function spawnImpactText(x, y, word) {
      const words = ["💥 咚！", "💢 碰！", "⚡ 匡！", "💥 轟！"];
      const text = word || words[Math.floor(Math.random() * words.length)];
      impactTexts.push({
        x: x,
        y: y,
        text: text,
        vy: -1.5,
        life: 1.0,
        decay: 0.04,
        scale: 1.4,
        rot: (Math.random() - 0.5) * 0.3
      });
    }

    // --- COLLISION & RULES ---
    function handleCollisions(event) {
      if (gameState !== 'DEFENDING') return;

      const pairs = event.pairs;
      for (let i = 0; i < pairs.length; i++) {
        const { bodyA, bodyB } = pairs[i];

        // Bee stings character
        if ((bodyA.label === 'Bee' && bodyB.label === 'Character') ||
            (bodyA.label === 'Character' && bodyB.label === 'Bee')) {
          triggerFail("啊！金城武帥氣的臉被蜜蜂叮成了豬頭！");
          return;
        }

        // Character hits dangerous spike
        if ((bodyA.label === 'Spike' && bodyB.label === 'Character') ||
            (bodyA.label === 'Character' && bodyB.label === 'Spike')) {
          triggerFail("糟糕！刺到地面的尖銳圖釘了！");
          return;
        }

        // Bee hits chalk barrier or walls
        const isChalkA = bodyA.label === 'ChalkBarrier' || bodyA.label === 'Platform' || bodyA.label === 'Wall';
        const isChalkB = bodyB.label === 'ChalkBarrier' || bodyB.label === 'Platform' || bodyB.label === 'Wall';

        if ((bodyA.label === 'Bee' && isChalkB) || (isChalkA && bodyB.label === 'Bee')) {
          const beeBody = bodyA.label === 'Bee' ? bodyA : bodyB;
          const beeData = bees.find(b => b.body === beeBody);
          const contact = pairs[i].collision.supports[0] || beeBody.position;

          if (beeData && beeData.heavy) {
            playHeavyImpactSound();
            spawnImpactText(contact.x, contact.y);
            createSparks(contact.x, contact.y, '#f97316', 8);
          } else {
            createSparks(contact.x, contact.y, '#ffffff', 2);
          }
        }
      }
    }

    function checkFallBoundary() {
      if (!characterBody) return;
      if (characterBody.position.y > canvas.height + 60) {
        triggerFail("哎呀！金城武失足跌出黑板了！");
      }
    }

    function triggerFail(reason) {
      gameState = 'GAME_OVER';
      characterMood = 'hurt';
      clearInterval(timerInterval);
      playStingSound();

      if (characterBody) {
        createSparks(characterBody.position.x, characterBody.position.y, '#ef4444', 30);
      }

      setTimeout(() => {
        showResultModal(false, reason);
      }, 700);
    }

    function triggerVictory() {
      gameState = 'GAME_OVER';
      characterMood = 'victory';
      playWinSound();

      const stars = calculateStars();
      saveLevelScore(currentLevelId, stars);

      for (let i = 0; i < 45; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 180,
          y: canvas.height * 0.45,
          vx: (Math.random() - 0.5) * 8,
          vy: -Math.random() * 8 - 4,
          color: ['#fbbf24', '#f472b6', '#34d399', '#60a5fa', '#f87171'][Math.floor(Math.random() * 5)],
          size: Math.random() * 7 + 4,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 12,
          life: 1.0,
          decay: 0.012
        });
      }

      setTimeout(() => {
        showResultModal(true, "安全撐過 10 秒！下課鐘響啦！");
      }, 700);
    }

    // --- STARS & SCORE LOGIC ---
    function calculateStars() {
      const usedPct = 1 - (currentInkRemaining / MAX_INK_LENGTH);
      if (usedPct <= 0.35) return 3;
      if (usedPct <= 0.70) return 2;
      return 1;
    }

    function updateInkDisplay() {
      const pct = Math.max(0, (currentInkRemaining / MAX_INK_LENGTH) * 100);
      document.getElementById('ink-fill').style.width = pct + '%';

      const stars = calculateStars();
      const hudContainer = document.getElementById('hud-stamps');
      let html = '';
      for (let i = 1; i <= 3; i++) {
        html += i <= stars ? '<span class="stamp-excellent">優</span>' : '<span class="stamp-empty"></span>';
      }
      hudContainer.innerHTML = html;
    }

    function showResultModal(isSuccess, message) {
      const modal = document.getElementById('result-modal');
      const badge = document.getElementById('modal-icon-badge');
      const title = document.getElementById('modal-title');
      const desc = document.getElementById('modal-desc');
      const stampsContainer = document.getElementById('modal-stamps-container');
      const nextBtn = document.getElementById('modal-btn-next');

      modal.classList.remove('hidden');

      if (isSuccess) {
        badge.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl shadow-lg -mt-10 mb-2 border-2 border-white bg-emerald-500 text-white";
        badge.innerHTML = "🏆";
        title.innerText = "下課！";
        title.className = "text-xl font-black text-emerald-900 mb-0.5";
        desc.innerText = message;

        const stars = calculateStars();
        let starHTML = '';
        for (let i = 1; i <= 3; i++) {
          starHTML += i <= stars 
            ? '<span class="stamp-excellent scale-125">優</span>' 
            : '<span class="stamp-empty scale-125"></span>';
        }
        stampsContainer.innerHTML = starHTML;
        stampsContainer.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
      } else {
        badge.className = "w-16 h-16 rounded-full flex items-center justify-center text-3xl shadow-lg -mt-10 mb-2 border-2 border-white bg-rose-500 text-white";
        badge.innerHTML = "🐝";
        title.innerText = "挑戰失敗！";
        title.className = "text-xl font-black text-rose-950 mb-0.5";
        desc.innerText = message;
        stampsContainer.classList.add('hidden');
        nextBtn.classList.add('hidden');
      }
    }

    // --- SCHEDULE SCREEN RENDERING (課表) ---
    function renderSchedule() {
      const progress = loadProgress();
      const grid = document.getElementById('level-grid');
      grid.innerHTML = '';

      // Calculate total stars
      let totalStars = 0;
      Object.keys(progress).forEach(lvlId => {
        totalStars += progress[lvlId] || 0;
      });
      document.getElementById('total-stars-count').innerText = `${totalStars} / 45`;

      // Filter by active semester
      const levels = LEVEL_CATALOG.filter(l => l.sem === currentSemester);

      levels.forEach(lvl => {
        const isUnlocked = progress[lvl.id] !== undefined;
        const stars = progress[lvl.id] || 0;

        const card = document.createElement('div');
        card.className = `relative flex flex-col justify-between p-2 rounded-lg transition active:scale-95 cursor-pointer ${
          isUnlocked ? 'memo-paper' : 'memo-paper-locked'
        }`;

        // Top Pin & Number
        const pinColor = isUnlocked ? 'bg-rose-500' : 'bg-neutral-400';
        const statusText = !isUnlocked ? '<span class="text-[9px] text-neutral-300 ml-1">未上</span>' : '';

        // Star stamps row
        let stampHtml = '';
        for (let i = 1; i <= 3; i++) {
          if (i <= stars) {
            stampHtml += '<span class="stamp-excellent scale-75 -mx-0.5">優</span>';
          } else {
            stampHtml += '<span class="stamp-empty scale-75 -mx-0.5"></span>';
          }
        }

        card.innerHTML = `
          <!-- Push Pin -->
          <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-2.5 h-2.5 ${pinColor} rounded-full shadow border border-white"></div>
          
          <div class="flex items-baseline justify-between mt-1">
            <span class="text-base font-black ${isUnlocked ? 'text-stone-900' : 'text-stone-200'}">${lvl.id}</span>
            ${statusText}
          </div>

          <div class="text-[11px] font-bold truncate my-1 ${isUnlocked ? 'text-stone-800' : 'text-stone-300'}">
            ${lvl.name}
          </div>

          <div class="flex items-center justify-start h-5">
            ${isUnlocked ? stampHtml : ''}
          </div>
        `;

        if (isUnlocked) {
          card.onclick = () => {
            startLevel(lvl.id);
          };
        }

        grid.appendChild(card);
      });
    }

    function switchSemester(sem) {
      currentSemester = sem;
      const tab1 = document.getElementById('tab-sem1');
      const tab2 = document.getElementById('tab-sem2');

      if (sem === 1) {
        tab1.className = "flex-1 py-1.5 rounded-lg font-black text-xs transition border-2 border-white/40 bg-amber-100 text-stone-900 shadow";
        tab2.className = "flex-1 py-1.5 rounded-lg font-black text-xs transition border-2 border-dashed border-white/30 bg-black/30 text-amber-100/70 hover:bg-black/50";
      } else {
        tab2.className = "flex-1 py-1.5 rounded-lg font-black text-xs transition border-2 border-white/40 bg-amber-100 text-stone-900 shadow";
        tab1.className = "flex-1 py-1.5 rounded-lg font-black text-xs transition border-2 border-dashed border-white/30 bg-black/30 text-amber-100/70 hover:bg-black/50";

      renderSchedule();
    }

    function openSchedule() {
      clearInterval(timerInterval);
      renderSchedule();
      document.getElementById('schedule-screen').classList.remove('translate-y-full');
    }

    // --- PARTICLES ---
    function createSparks(x, y, color = '#ffffff', count = 5) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1;
        particles.push({
          x: x, y: y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color: color,
          size: Math.random() * 3 + 2,
          life: 1.0,
          decay: 0.035
        });
      }
    }

    function updateAndDrawParticles() {
      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= p.decay;
        if (p.rot !== undefined) p.rot += p.rotSpeed;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.translate(p.x, p.y);
        if (p.rot) ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }

      // Impact pop-up comic texts
      for (let i = impactTexts.length - 1; i >= 0; i--) {
        const t = impactTexts[i];
        t.y += t.vy;
        t.life -= t.decay;
        t.scale = Math.max(1.0, t.scale - 0.02);

        if (t.life <= 0) {
          impactTexts.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = t.life;
        ctx.translate(t.x, t.y);
        ctx.rotate(t.rot);
        ctx.scale(t.scale, t.scale);

        ctx.font = '900 18px "Zen Maru Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeText(t.text, 0, 0);
        ctx.fillStyle = '#facc15';
        ctx.fillText(t.text, 0, 0);

        ctx.restore();
      }
    }

    // --- CANVAS DRAWING ROUTINES ---
    function drawBackgroundGrid() {
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const step = 32;
      for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPlatforms() {
      ctx.save();
      staticPlatforms.forEach(p => {
        const pos = p.body.position;
        const w = p.w;
        const h = p.h;

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(p.angle);

        ctx.fillStyle = '#451a03';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([7, 4]);

        ctx.beginPath();
        ctx.roundRect(-w / 2, -h / 2, w, h, 6);
        ctx.fill();
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.font = 'bold 11px "Zen Maru Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.label, 0, 0);

        ctx.restore();
      });

      // Spikes
      dangerSpikes.forEach(s => {
        const pos = s.body.position;
        const w = s.w;
        const h = s.h;

        ctx.save();
        ctx.translate(pos.x, pos.y);

        ctx.fillStyle = '#b91c1c';
        ctx.beginPath();
        const count = Math.max(1, Math.floor(w / 14));
        const step = w / count;
        const startX = -w / 2;

        for (let i = 0; i < count; i++) {
          const x = startX + i * step;
          ctx.moveTo(x, h / 2);
          ctx.lineTo(x + step / 2, -h / 2);
          ctx.lineTo(x + step, h / 2);
        }
        ctx.fill();
        ctx.restore();
      });

      ctx.restore();
    }

    function drawBeeHives() {
      beeHives.forEach(hive => {
        ctx.save();
        ctx.translate(hive.x, hive.y);

        ctx.strokeStyle = '#5c2b09';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(-22, -18);
        ctx.lineTo(22, -18);
        ctx.stroke();

        ctx.fillStyle = hive.heavy ? '#ea580c' : '#f59e0b';
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, -8, 16, 11, 0, 0, Math.PI * 2);
        ctx.ellipse(0, 2, 22, 13, 0, 0, Math.PI * 2);
        ctx.ellipse(0, 14, 18, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#3f1a04';
        ctx.beginPath();
        ctx.arc(0, 6, 7, 0, Math.PI * 2);
        ctx.fill();

        // 大力蜂巢標記
        if (hive.heavy) {
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9px "Zen Maru Gothic", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText("⚡力", 0, -8);
        }

        ctx.restore();
      });
    }

    function drawBees() {
      const now = Date.now() * 0.005;
      bees.forEach(b => {
        const pos = b.body.position;
        const vel = b.body.velocity;
        const headingAngle = Math.atan2(vel.y, vel.x);

        const hoverOffsetY = Math.sin(now * b.floatFreq * 4 + b.buzzSeed) * 2;

        ctx.save();
        ctx.translate(pos.x, pos.y + hoverOffsetY);
        ctx.rotate(headingAngle);

        // Flapping wings
        ctx.fillStyle = 'rgba(224, 242, 254, 0.9)';
        const wingFlap = Math.sin(b.wingPhase) * 6;
        const wingScale = b.heavy ? 1.8 : 1.0;

        ctx.beginPath();
        ctx.ellipse(-2 * wingScale, -9 * wingScale + wingFlap * 0.3, 5 * wingScale, 8 * wingScale, -0.3, 0, Math.PI * 2);
        ctx.ellipse(2 * wingScale, -9 * wingScale - wingFlap * 0.3, 5 * wingScale, 8 * wingScale, 0.3, 0, Math.PI * 2);
        ctx.fill();

        // Soft hovering shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.beginPath();
        ctx.ellipse(0, (b.heavy ? 20 : 11) - hoverOffsetY * 0.5, b.heavy ? 12 : 6, b.heavy ? 4 : 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // 巨型大力蜂首領渲染
        if (b.heavy) {
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          ctx.ellipse(0, 0, 24, 18, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#7c2d12';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Stripes
          ctx.fillStyle = '#18181b';
          ctx.fillRect(-6, -16, 7, 32);
          ctx.fillRect(7, -15, 7, 30);

          // Giant Stinger
          ctx.fillStyle = '#09090b';
          ctx.beginPath();
          ctx.moveTo(-24, 0);
          ctx.lineTo(-34, -5);
          ctx.lineTo(-34, 5);
          ctx.closePath();
          ctx.fill();

          // Angry Eyes
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(12, -4, 5.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.arc(14, -4, 3, 0, Math.PI * 2);
          ctx.fill();

          // Angry Eyebrow
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(7, -11);
          ctx.lineTo(17, -7);
          ctx.stroke();

          // Crown mark
          ctx.fillStyle = '#facc15';
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText('👑', 2, -18);
        } else {
          // 普通蜜蜂渲染
          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2);
          ctx.fill();

          // Stripes
          ctx.fillStyle = '#18181b';
          ctx.fillRect(-3, -7, 3, 14);
          ctx.fillRect(3, -7, 3, 14);

          // Stinger
          ctx.fillStyle = '#09090b';
          ctx.beginPath();
          ctx.moveTo(-11, 0);
          ctx.lineTo(-16, -2.5);
          ctx.lineTo(-16, 2.5);
          ctx.closePath();
          ctx.fill();

          // Eye
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(6, -2, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(7, -2, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      });
    }

    function drawCharacter() {
      if (!characterBody) return;
      const pos = characterBody.position;
      const angle = characterBody.angle;

      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(angle);

      let currentImg = heroImages.normal;
      if (characterMood === 'scared') {
        currentImg = heroImages.scared;
      } else if (characterMood === 'hurt') {
        currentImg = heroImages.hurt;
      } else if (characterMood === 'victory') {
        currentImg = heroImages.normal;
      }

      const targetWidth = CHAR_RADIUS * 2.8; 
      const targetHeight = targetWidth * 1.15;

      if (currentImg && currentImg.complete && currentImg.naturalWidth > 0) {
        try {
          ctx.drawImage(currentImg, -targetWidth / 2, -targetHeight / 2 - 4, targetWidth, targetHeight);
        } catch (e) {
          drawFallbackCharacter();
        }
      } else {
        drawFallbackCharacter();
      }

      function drawFallbackCharacter() {
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(0, 0, CHAR_RADIUS, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        if (characterMood === 'scared') {
          ctx.arc(0, 10, 5, 0, Math.PI * 2);
        } else if (characterMood === 'hurt') {
          ctx.arc(0, 14, 6, Math.PI, 0);
        } else {
          ctx.arc(0, 6, 6, 0, Math.PI);
        }
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawChalkBodies() {
      ctx.save();
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
      ctx.shadowBlur = 6;

      userDrawnBodies.forEach(compound => {
        if (!compound.parts) return;
        compound.parts.forEach((part, index) => {
          if (index === 0) return;
          ctx.beginPath();
          const vertices = part.vertices;
          ctx.moveTo(vertices[0].x, vertices[0].y);
          for (let v = 1; v < vertices.length; v++) {
            ctx.lineTo(vertices[v].x, vertices[v].y);
          }
          ctx.closePath();
          ctx.fill();
        });
      });
      ctx.restore();
    }

    function drawCurrentDrawingStroke() {
      if (rawStrokePoints.length < 2) return;

      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowBlur = 8;

      ctx.beginPath();
      ctx.moveTo(rawStrokePoints[0].x, rawStrokePoints[0].y);
      for (let i = 1; i < rawStrokePoints.length; i++) {
        ctx.lineTo(rawStrokePoints[i].x, rawStrokePoints[i].y);
      }
      ctx.stroke();
      ctx.restore();
    }

    // --- GAME ENGINE & RENDER LOOP ---
    function gameLoop() {
      if (engine) {
        Engine.update(engine, 1000 / 60);
      }

      if (gameState === 'DEFENDING') {
        checkFallBoundary();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackgroundGrid();
      drawPlatforms();
      drawBeeHives();
      drawChalkBodies();
      drawCharacter();
      drawBees();
      drawCurrentDrawingStroke();
      updateAndDrawParticles();

      requestAnimationFrame(gameLoop);
    }

    // --- INPUT EVENT HANDLING ---
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function onPointerDown(e) {
      if (gameState !== 'DRAWING') return;
      initAudio();
      isDrawing = true;
      const pt = getPointerPos(e);
      rawStrokePoints = [pt];
    }

    function onPointerMove(e) {
      if (!isDrawing || gameState !== 'DRAWING') return;
      const pt = getPointerPos(e);
      const last = rawStrokePoints[rawStrokePoints.length - 1];
      const dist = Math.hypot(pt.x - last.x, pt.y - last.y);

      if (dist >= 4) {
        if (currentInkRemaining - dist <= 0) {
          isDrawing = false;
          currentInkRemaining = 0;
          updateInkDisplay();
          finishDrawingAndStartDefend();
          return;
        }

        currentInkRemaining -= dist;
        updateInkDisplay();
        rawStrokePoints.push(pt);
        playChalkSound();
      }
    }

    function onPointerUp() {
      if (!isDrawing || gameState !== 'DRAWING') return;
      isDrawing = false;
      if (rawStrokePoints.length >= 2) {
        finishDrawingAndStartDefend();
      } else {
        rawStrokePoints = [];
      }
    }

    // Bind Canvas Events
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
    window.addEventListener('touchmove', (e) => { onPointerMove(e); }, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // Button Listeners
    document.getElementById('btn-open-schedule').addEventListener('click', openSchedule);
    document.getElementById('btn-schedule-back').addEventListener('click', () => {
      document.getElementById('schedule-screen').classList.add('translate-y-full');
    });

    document.getElementById('tab-sem1').addEventListener('click', () => switchSemester(1));
    document.getElementById('tab-sem2').addEventListener('click', () => switchSemester(2));

    document.getElementById('btn-restart').addEventListener('click', () => startLevel(currentLevelId));
    document.getElementById('modal-btn-retry').addEventListener('click', () => startLevel(currentLevelId));
    document.getElementById('modal-btn-next').addEventListener('click', () => {
      const nextId = currentLevelId + 1;
      if (nextId <= 30) {
        startLevel(nextId);
      } else {
        openSchedule();
      }
    });
    document.getElementById('modal-btn-schedule').addEventListener('click', () => {
      document.getElementById('result-modal').classList.add('hidden');
      openSchedule();
    });

    // Custom Face Modal
    document.getElementById('btn-custom-faces').addEventListener('click', () => {
      document.getElementById('face-modal').classList.remove('hidden');
    });
    document.getElementById('btn-close-face-modal').addEventListener('click', () => {
      document.getElementById('face-modal').classList.add('hidden');
    });
    document.getElementById('btn-save-face-modal').addEventListener('click', () => {
      document.getElementById('face-modal').classList.add('hidden');
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
      startLevel(currentLevelId);
    });

    window.onload = function() {
      try {
        resizeCanvas();
        renderSchedule();
        startLevel(1);
        gameLoop();
      } catch (err) {
        console.error("Initialization error:", err);
      }
    };
  </script>
</body>
</html>
